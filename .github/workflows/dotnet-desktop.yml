name: CI

# Full `dotnet build` needs game + Unity assemblies under src/SuperMarketDll/ and src/BepInExDll/.
# On GitHub-hosted ubuntu-latest, add those (e.g. self-hosted runner, cache, or private bootstrap) or this job will fail at build.
# See README: "Developing locally" and "Continuous integration".

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project and setup docs
        run: |
          test -f src/SuperMarketStockTakeAPI.csproj
          test -f src/SuperMarketDll/README.md
          test -f src/BepInExDll/README.md

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/SuperMarketStockTakeAPI.csproj

      - name: Build (Release)
        run: dotnet build src/SuperMarketStockTakeAPI.csproj -c Release --no-restore -v minimal

      - name: Stage DLL under .release
        run: |
          mkdir -p .release
          cp src/bin/Release/net472/SuperMarketStockTakeAPI.dll .release/

      - name: Verify .release contains the plugin DLL
        run: |
          test -d .release
          test -f .release/SuperMarketStockTakeAPI.dll
          ls -la .release/SuperMarketStockTakeAPI.dll

      - name: Upload .release artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperMarketStockTakeAPI
          path: .release/SuperMarketStockTakeAPI.dll
          if-no-files-found: error
